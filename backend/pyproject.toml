[project]
name = "vigil-backend"
version = "0.1.0"
description = "Vigil backend: FastAPI app, simulator, fast-tier scoring (Tiger) and deep tier (Snowflake)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "reportlab>=5.0.1",
    "snowflake-connector-python[pandas]>=5.0.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pypdf>=6.21.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]
