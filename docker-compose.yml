# Production-style stack: Caddy (:8080) → backend:8000 (/api, /ws) and frontend:3000 (everything else).
#   make up     # build + start
#   make down
# For hot-reload development use `make dev` (local processes) instead.

services:
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      SNOWFLAKE_PRIVATE_KEY_PATH: /srv/vigil/secrets/snowflake_rsa_key.p8
    volumes:
      - ./secrets:/srv/vigil/secrets:ro
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    expose:
      - "3000"
    restart: unless-stopped

  caddy:
    image: caddy:2.11-alpine
    depends_on:
      - backend
      - frontend
    ports:
      - "8080:8080"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:8080}
      BACKEND_UPSTREAM: backend:8000
      FRONTEND_UPSTREAM: frontend:3000
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
