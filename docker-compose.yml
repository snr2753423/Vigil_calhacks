# Production-style stack: Caddy → backend:8000 (/api, /ws) and frontend:3000 (everything else).
#   make up       # local: build + start on http://localhost:8080
#   make down
# On the Vultr server, docker-compose.prod.yml is layered on top (real domain, HTTPS on 80/443): see DEPLOY.md.
# For hot-reload development use `make dev` (local processes) instead.

x-logging: &logging  # keep container logs from filling a small VM's disk
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      SNOWFLAKE_PRIVATE_KEY_PATH: /srv/vigil/secrets/snowflake_rsa_key.p8
    volumes:
      - ./secrets:/srv/vigil/secrets:ro
    expose:
      - "8000"
    # Shutdown cancels running Snowflake queries and stops the background loops (≤ ~15 s): don't SIGKILL it first.
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging: *logging
    restart: unless-stopped

  frontend:
    build: ./frontend
    expose:
      - "3000"
    logging: *logging
    restart: unless-stopped

  caddy:
    image: caddy:2.11-alpine
    depends_on:
      - backend
      - frontend
    ports:
      - "8080:8080"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:8080}
      BACKEND_UPSTREAM: backend:8000
      FRONTEND_UPSTREAM: frontend:3000
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
